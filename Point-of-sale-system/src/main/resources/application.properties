spring.application.name=Point-of-sale-system

server.port=5000

# ==============================================================================
# Configuration Import
# Automatically loads application-local.properties if present for local development.
# In production / CI, configuration is provided via environment variables.
# ==============================================================================
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties,optional:file:./Point-of-sale-system/application-local.properties

# ==============================================================================
# Database Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/POS_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# Hibernate
# ==============================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Enable SQL parameter logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================================================================
# JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET:}

# ==============================================================================
# Razorpay Configuration
# ==============================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ==============================================================================
# Stripe Configuration (Optional)
# ==============================================================================
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}

# ==============================================================================
# Mail Configuration (Optional)
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
